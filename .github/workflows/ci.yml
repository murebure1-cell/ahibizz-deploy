name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ahibizz_ci
          POSTGRES_USER: ahibizz_ci
          POSTGRES_PASSWORD: ci_fixture_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ahibizz_ci -d ahibizz_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Install the package manager pinned in package.json
        run: npm install --global pnpm@12.18.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint, types and unit tests
        run: pnpm check
      - name: Test migrations against isolated PostgreSQL
        env:
          CI: "true"
          AHIBIZZ_TEST_DATABASE_URL: postgresql://ahibizz_ci:ci_fixture_only@127.0.0.1:5432/ahibizz_ci?sslmode=disable
        run: node --test tests/integration/postgres.test.mjs
      - name: Test authentication against isolated PostgreSQL
        timeout-minutes: 3
        env:
          CI: "true"
          AHIBIZZ_TEST_DATABASE_URL: postgresql://ahibizz_ci:ci_fixture_only@127.0.0.1:5432/ahibizz_ci?sslmode=disable
        run: node --import tsx --test tests/integration/auth.test.mjs
      - name: Test directory against isolated PostgreSQL
        timeout-minutes: 3
        env:
          CI: "true"
          AHIBIZZ_TEST_DATABASE_URL: postgresql://ahibizz_ci:ci_fixture_only@127.0.0.1:5432/ahibizz_ci?sslmode=disable
        run: node --import tsx --test tests/integration/directory.test.mjs
      - name: Test initial owner operator against isolated PostgreSQL
        timeout-minutes: 3
        env:
          CI: "true"
          AHIBIZZ_TEST_DATABASE_URL: postgresql://ahibizz_ci:ci_fixture_only@127.0.0.1:5432/ahibizz_ci?sslmode=disable
        run: node --test tests/integration/initial-owner.test.mjs
      - name: Test booking against isolated PostgreSQL
        timeout-minutes: 3
        env:
          CI: "true"
          AHIBIZZ_TEST_DATABASE_URL: postgresql://ahibizz_ci:ci_fixture_only@127.0.0.1:5432/ahibizz_ci?sslmode=disable
        run: node --import tsx --test tests/integration/booking.test.mjs
      - name: Test personal profiles against isolated PostgreSQL
        timeout-minutes: 3
        env:
          CI: "true"
          AHIBIZZ_TEST_DATABASE_URL: postgresql://ahibizz_ci:ci_fixture_only@127.0.0.1:5432/ahibizz_ci?sslmode=disable
        run: node --import tsx --test tests/integration/people.test.mjs
      - name: Test public profiles and connections against isolated PostgreSQL
        timeout-minutes: 3
        env:
          CI: "true"
          AHIBIZZ_TEST_DATABASE_URL: postgresql://ahibizz_ci:ci_fixture_only@127.0.0.1:5432/ahibizz_ci?sslmode=disable
        run: node --import tsx --test tests/integration/connections.test.mjs
      - name: Test business media against isolated PostgreSQL
        timeout-minutes: 3
        env:
          CI: "true"
          AHIBIZZ_TEST_DATABASE_URL: postgresql://ahibizz_ci:ci_fixture_only@127.0.0.1:5432/ahibizz_ci?sslmode=disable
        run: node --import tsx --test tests/integration/business-media.test.mjs
      - name: Test messaging against isolated PostgreSQL
        timeout-minutes: 3
        env:
          CI: "true"
          AHIBIZZ_TEST_DATABASE_URL: postgresql://ahibizz_ci:ci_fixture_only@127.0.0.1:5432/ahibizz_ci?sslmode=disable
        run: node --import tsx --test tests/integration/messaging.test.mjs
      - name: Test account erasure against isolated PostgreSQL
        timeout-minutes: 3
        env:
          CI: "true"
          AHIBIZZ_TEST_DATABASE_URL: postgresql://ahibizz_ci:ci_fixture_only@127.0.0.1:5432/ahibizz_ci?sslmode=disable
        run: node --import tsx --test tests/integration/account-erasure.test.mjs
      - name: Test business details against isolated PostgreSQL
        timeout-minutes: 3
        env:
          CI: "true"
          AHIBIZZ_TEST_DATABASE_URL: postgresql://ahibizz_ci:ci_fixture_only@127.0.0.1:5432/ahibizz_ci?sslmode=disable
        run: node --import tsx --test tests/integration/business-details.test.mjs
      - name: Test business reviews against isolated PostgreSQL
        timeout-minutes: 3
        env:
          CI: "true"
          AHIBIZZ_TEST_DATABASE_URL: postgresql://ahibizz_ci:ci_fixture_only@127.0.0.1:5432/ahibizz_ci?sslmode=disable
        run: node --import tsx --test tests/integration/business-reviews.test.mjs
      - name: Test private business favorites against isolated PostgreSQL
        timeout-minutes: 3
        env:
          CI: "true"
          AHIBIZZ_TEST_DATABASE_URL: postgresql://ahibizz_ci:ci_fixture_only@127.0.0.1:5432/ahibizz_ci?sslmode=disable
        run: node --import tsx --test tests/integration/business-favorites.test.mjs
      - name: Test ownership transfer and manual verification against isolated PostgreSQL
        timeout-minutes: 3
        env:
          CI: "true"
          AHIBIZZ_TEST_DATABASE_URL: postgresql://ahibizz_ci:ci_fixture_only@127.0.0.1:5432/ahibizz_ci?sslmode=disable
        run: node --import tsx --test tests/integration/business-ownership.test.mjs
      - name: Test Reel feed and engagement against isolated PostgreSQL
        timeout-minutes: 3
        env:
          CI: "true"
          AHIBIZZ_TEST_DATABASE_URL: postgresql://ahibizz_ci:ci_fixture_only@127.0.0.1:5432/ahibizz_ci?sslmode=disable
        run: node --import tsx --test tests/integration/reels.test.mjs
      - name: Test promotions against isolated PostgreSQL
        timeout-minutes: 3
        env:
          CI: "true"
          AHIBIZZ_TEST_DATABASE_URL: postgresql://ahibizz_ci:ci_fixture_only@127.0.0.1:5432/ahibizz_ci?sslmode=disable
        run: node --import tsx --test tests/integration/promotions.test.mjs
      - name: Build the production image
        run: docker build --pull --tag ahibizz:ci .
      - name: Scan the exact production image for high and critical vulnerabilities
        timeout-minutes: 7
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ahibizz-security" "$RUNNER_TEMP/ahibizz-trivy-cache"
          docker image inspect ahibizz:ci > "$RUNNER_TEMP/ahibizz-security/image-inspect.json"
          docker save --platform linux/amd64 --output "$RUNNER_TEMP/ahibizz-image.tar" ahibizz:ci
          node scripts/check-runtime-security.mjs --extract-image-identity \
            "$RUNNER_TEMP/ahibizz-image.tar" "$RUNNER_TEMP/ahibizz-security"
          scanner=aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
          docker run --rm "$scanner" --version > "$RUNNER_TEMP/ahibizz-security/scanner-version.txt"
          docker run --rm \
            --volume "$RUNNER_TEMP/ahibizz-image.tar:/image.tar:ro" \
            --volume "$RUNNER_TEMP/ahibizz-security:/evidence" \
            --volume "$RUNNER_TEMP/ahibizz-trivy-cache:/root/.cache/trivy" \
            "$scanner" image --input /image.tar --scanners vuln --list-all-pkgs \
            --ignorefile /dev/null --format json \
            --output /evidence/runtime.json --exit-code 0 --timeout 5m
          docker run --rm --volume "$RUNNER_TEMP/ahibizz-trivy-cache:/root/.cache/trivy" \
            "$scanner" version --format json > "$RUNNER_TEMP/ahibizz-security/scanner-version.json"
          image_id=$(docker image inspect --format '{{.Id}}' ahibizz:ci)
          node scripts/check-runtime-security.mjs "$RUNNER_TEMP/ahibizz-security/runtime.json" \
            "$image_id" "$GITHUB_SHA" "$RUNNER_TEMP/ahibizz-security/summary.json" \
            "$RUNNER_TEMP/ahibizz-security/image-inspect.json" \
            "$RUNNER_TEMP/ahibizz-security/archive-manifest.json" \
            "$RUNNER_TEMP/ahibizz-security/archive-config.json" \
            "$RUNNER_TEMP/ahibizz-security/archive-identity.json"
      - name: Preserve the complete runtime vulnerability report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-security
          path: ${{ runner.temp }}/ahibizz-security/
          if-no-files-found: error
          retention-days: 14
      - name: Smoke test the production entrypoint and database readiness
        timeout-minutes: 3
        env:
          DATABASE_URL: postgresql://ahibizz_ci:ci_fixture_only@127.0.0.1:5432/ahibizz_ci?sslmode=disable
        run: |
          set -euo pipefail
          name=ahibizz-smoke
          container_id=
          if docker container inspect "$name" >/dev/null 2>&1; then
            echo "Refusing to replace an existing smoke-test container."
            exit 1
          fi
          node -e '
            const probe = require("node:net").createServer();
            probe.once("error", () => {
              console.error("Smoke-test port 3099 is already in use.");
              process.exit(1);
            });
            probe.listen(3099, "127.0.0.1", () => probe.close());
          '
          cleanup() {
            code=$?
            trap - EXIT
            if [[ -n "$container_id" ]]; then
              if (( code != 0 )); then docker logs "$container_id" || true; fi
              docker rm --force "$container_id" >/dev/null || true
            fi
            exit "$code"
          }
          trap cleanup EXIT
          container_id=$(docker run --detach --name "$name" --network host \
            --env PORT=3099 --env DATABASE_URL ahibizz:ci)
          deadline=$((SECONDS + 60))
          live="$RUNNER_TEMP/ahibizz-smoke-live.json"
          ready="$RUNNER_TEMP/ahibizz-smoke-ready.json"
          while (( SECONDS < deadline )); do
            if [[ "$(docker inspect --format '{{.State.Running}}' "$container_id")" != true ]]; then
              echo "Production entrypoint stopped before becoming ready."
              exit 1
            fi
            if curl --fail --silent --max-time 2 http://127.0.0.1:3099/api/health/live -o "$live" \
              && curl --fail --silent --max-time 2 http://127.0.0.1:3099/api/health/ready -o "$ready" \
              && node -e '
                const fs = require("node:fs");
                const live = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
                const ready = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
                process.exit(live.status === "ok" && ready.status === "ok" &&
                  ready.checks?.database === "ready" ? 0 : 1);
              ' "$live" "$ready"; then
              echo "Production entrypoint: liveness and PostgreSQL readiness passed."
              exit 0
            fi
            sleep 2
          done
          echo "Production entrypoint did not become ready within 60 seconds."
          exit 1
      - name: Smoke test key pages render on the production image
        timeout-minutes: 3
        env:
          DATABASE_URL: postgresql://ahibizz_ci:ci_fixture_only@127.0.0.1:5432/ahibizz_ci?sslmode=disable
        run: |
          set -euo pipefail
          name=ahibizz-route-smoke
          container_id=
          if docker container inspect "$name" >/dev/null 2>&1; then
            echo "Refusing to replace an existing route smoke-test container."
            exit 1
          fi
          cleanup() {
            code=$?
            trap - EXIT
            if [[ -n "$container_id" ]]; then
              if (( code != 0 )); then docker logs "$container_id" || true; fi
              docker rm --force "$container_id" >/dev/null || true
            fi
            exit "$code"
          }
          trap cleanup EXIT
          container_id=$(docker run --detach --name "$name" --network host \
            --env PORT=3099 --env DATABASE_URL \
            --env BETTER_AUTH_URL=http://127.0.0.1:3099 \
            --env BETTER_AUTH_SECRET=isolated-ci-only-secret-over-thirty-two-characters \
            --env SMTP_HOST=fixture.invalid --env SMTP_PORT=465 --env SMTP_USER=fixture \
            --env SMTP_PASSWORD=fixture-only --env SMTP_FROM=no-reply@fixture.invalid \
            ahibizz:ci)
          deadline=$((SECONDS + 60))
          until curl --fail --silent --max-time 2 http://127.0.0.1:3099/api/health/ready >/dev/null; do
            if (( SECONDS >= deadline )); then
              echo "Route smoke server did not become ready within 60 seconds."
              exit 1
            fi
            sleep 2
          done
          node scripts/smoke-routes.mjs http://127.0.0.1:3099
          docker stop --time 15 "$container_id" >/dev/null
      - name: Smoke test guarded ingress with client-IP trust disabled
        timeout-minutes: 3
        env:
          DATABASE_URL: postgresql://ahibizz_ci:ci_fixture_only@127.0.0.1:5432/ahibizz_ci?sslmode=disable
        run: |
          set -euo pipefail
          name=ahibizz-ingress-smoke
          container_id=
          if docker container inspect "$name" >/dev/null 2>&1; then
            echo "Refusing to replace an existing ingress smoke-test container."
            exit 1
          fi
          node --import tsx --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          import { createServer } from 'node:net';
          import { enforcementEnv } from './tests/ingress-enforcement-fixtures.ts';
          for (const port of [3099, 3100]) {
            const server = createServer();
            await new Promise((resolve, reject) => server.once('error', reject).listen(port, '127.0.0.1', resolve));
            await new Promise(resolve => server.close(resolve));
          }
          const env = { ...enforcementEnv(3100), PORT: '3099',
            AHIBIZZ_INGRESS_TRUST_CLIENT_IP: 'false', DATABASE_URL: process.env.DATABASE_URL,
            BETTER_AUTH_SECRET: 'isolated-ci-only-secret-over-thirty-two-characters',
            SMTP_HOST: 'fixture.invalid', SMTP_PORT: '465', SMTP_USER: 'fixture',
            SMTP_PASSWORD: 'fixture-only', SMTP_FROM: 'no-reply@fixture.invalid' };
          for (const value of Object.values(env)) if (typeof value !== 'string' || /[\r\n]/.test(value)) throw new Error('Invalid isolated smoke env.');
          writeFileSync(process.env.RUNNER_TEMP + '/ingress-smoke.env', Object.entries(env).map(([key,value]) => key+'='+value).join('\n')+'\n', { mode: 0o600 });
          NODE
          cleanup() {
            code=$?
            trap - EXIT
            if [[ -n "$container_id" ]]; then
              if (( code != 0 )); then docker logs "$container_id" || true; fi
              docker rm --force "$container_id" >/dev/null || true
            fi
            exit "$code"
          }
          trap cleanup EXIT
          container_id=$(docker run --detach --name "$name" --network host \
            --env-file "$RUNNER_TEMP/ingress-smoke.env" ahibizz:ci)
          deadline=$((SECONDS + 60))
          ready=false
          while (( SECONDS < deadline )); do
            if [[ "$(docker inspect --format '{{.State.Running}}' "$container_id")" != true ]]; then
              echo "Guarded production entrypoint stopped before becoming ready."
              exit 1
            fi
            if curl --fail --silent --max-time 2 http://127.0.0.1:3099/api/health/live >/dev/null \
              && curl --fail --silent --max-time 2 http://127.0.0.1:3099/api/health/ready >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          [[ "$ready" == true ]]
          canonical=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 5 \
            -H 'Host: 127.0.0.1:3099' -H 'X-Real-IP: 203.0.113.9' \
            http://127.0.0.1:3099/api/account)
          untrusted=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 5 \
            --interface 127.0.0.2 -H 'Host: 127.0.0.1:3099' -H 'X-Real-IP: 127.0.0.1' \
            -H 'X-AhiBizz-Ingress-Client-IP: 203.0.113.9' http://127.0.0.1:3099/api/account)
          foreign_origin=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 5 \
            -H 'Host: container_name:3099' -H 'X-Real-IP: 203.0.113.9' \
            -H 'Origin: https://untrusted.invalid' -H 'Referer: https://untrusted.invalid/source' \
            -H 'Content-Type: application/json' \
            --data '{"email":"missing@fixture.invalid","password":"isolated-fixture-only-password"}' \
            http://127.0.0.1:3099/api/auth/sign-in/email)
          [[ "$canonical" == 401 && "$untrusted" == 403 && "$foreign_origin" == 403 ]]
          docker stop --time 15 "$container_id" >/dev/null
          echo "Guarded production entrypoint: loopback health, canonical auth boundary and denied peer passed; client-IP trust stayed disabled."
